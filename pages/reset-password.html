<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Đặt lại mật khẩu - EduTrack</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/password-recovery.css">
    <script src="../assets/js/reset-password.js" defer></script>
</head>
<body>
    <main class="recovery-page">
        <section class="recovery-card">
            <div class="recovery-header">
                <h1>Đặt lại mật khẩu</h1>
                <p>
                    Nhập mật khẩu mới và xác nhận
                    để hoàn tất khôi phục tài khoản.
                </p>

            </div>

            <form class="reset-password-form" novalidate>

                <!-- Mật khẩu mới -->

                <div class="recovery-form-group">

                    <label for="new-password">
                        Mật khẩu mới
                        <span class="recovery-required">*</span>
                    </label>

                    <input
                        type="password"
                        id="new-password"
                        name="password"
                        placeholder="Nhập mật khẩu mới"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="64"
                        required
                    >

                    <small class="recovery-hint">
                        Mật khẩu từ 8 đến 64 ký tự.
                    </small>

                    <small
                        id="new-password-error"
                        class="recovery-field-error">
                    </small>

                </div>

                <!-- Xác nhận mật khẩu -->

                <div class="recovery-form-group">

                    <label for="confirm-new-password">
                        Xác nhận mật khẩu mới
                        <span class="recovery-required">*</span>
                    </label>

                    <input
                        type="password"
                        id="confirm-new-password"
                        name="confirmPassword"
                        placeholder="Nhập lại mật khẩu mới"
                        autocomplete="new-password"
                        maxlength="64"
                        required
                    >

                    <small
                        id="confirm-new-password-error"
                        class="recovery-field-error">
                    </small>

                </div>

                <button
                    type="submit"
                    class="recovery-submit">

                    Đặt lại mật khẩu

                </button>

                <p
                    class="recovery-message"
                    role="status"
                    aria-live="polite">
                </p>

            </form>

            <p class="recovery-back">

                <a href="login.html">
                    ← Quay lại đăng nhập
                </a>

            </p>

        </section>

    </main>

</body>
</html>
