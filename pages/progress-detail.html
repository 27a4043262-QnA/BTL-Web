
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Chi tiết lộ trình và nhiệm vụ học tập trên EduTrack.">
    <title>EduTrack - Chi tiết lộ trình học tập</title>

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/progress.css">

    <script src="../assets/js/progress.js" defer></script>
    <link rel="stylesheet" href="../assets/css/chatbot.css">
    <script src="../assets/js/chatbot.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body class="ep-page">

    <!-- Header + Sidebar -->
    <div class="et-navigation-root"></div>
    
<main id="main-content"
      class="ep-main"
      data-progress-page="detail">

    <div class="ep-container">

        <!-- ĐIỀU HƯỚNG -->
        <nav class="ep-breadcrumb"
             aria-label="Đường dẫn điều hướng">

            <a href="progress.html">
                Tiến độ học tập
            </a>

            <span aria-hidden="true">/</span>

            <span aria-current="page">
                Chi tiết giai đoạn
            </span>
        </nav>

        <a href="progress.html"
           class="ep-back-link">
            ← Quay lại Tiến độ học tập
        </a>

        <!-- NỘI DUNG CHI TIẾT TỰ ĐỘNG -->
        <div id="ep-detail-content">
            <div class="ep-panel ep-loading">
                Đang tải thông tin giai đoạn...
            </div>
        </div>

        <!-- ĐƯỜNG DẪN HỖ TRỢ -->
        <section class="ep-detail-help">
            <div>
                <h2>Cần hỗ trợ trong quá trình học?</h2>

                <p>
                    Bạn có thể xem lại gợi ý học tập,
                    tài liệu hoặc điều chỉnh kế hoạch.
                </p>
            </div>

            <div class="ep-detail-help-actions">
                <a href="courses.html"
                   class="ep-button ep-button-secondary">
                    Xem môn học
                </a>

                <a href="advising-contact.html?state=3"
                   class="ep-button ep-button-primary">
                    Mở trang Tư vấn
                </a>
            </div>
        </section>

        <p id="ep-live-status"
           class="ep-live-status"
           role="status"
           aria-live="polite">
        </p>
    </div>
</main>
</body>
</html>
