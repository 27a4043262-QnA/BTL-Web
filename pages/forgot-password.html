<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - EduTrack</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/password-recovery.css">
    <script src="../assets/js/forgot-password.js" defer></script>
</head>
<body>
    <main class="recovery-page">
        <section class="recovery-card">
            <div class="recovery-header">
                <h1>Quên mật khẩu?</h1>
                <p>
                    Nhập địa chỉ email đã đăng ký
                    EduTrack. Chúng tôi sẽ gửi
                    cho bạn liên kết đặt lại mật khẩu.
                </p>

            </div>

            <form
                class="forgot-password-form"
                novalidate>

                <div class="recovery-form-group">

                    <label for="recovery-email">
                        Địa chỉ email
                    </label>

                    <input
                        type="email"
                        id="recovery-email"
                        name="email"
                        placeholder="Nhập email đã đăng ký"
                        autocomplete="email"
                        maxlength="254"
                        required>

                    <small
                        class="recovery-field-error"
                        id="recovery-email-error"
                        aria-live="polite">
                    </small>

                </div>

                <button
                    type="submit"
                    class="recovery-submit">

                    Gửi liên kết đặt lại mật khẩu

                </button>

                <p
                    class="recovery-message"
                    role="status"
                    aria-live="polite">
                </p>

            </form>

            <p class="recovery-back">

                <a href="login.html">
                    ← Quay lại đăng nhập
                </a>

            </p>

        </section>

    </main>

</body>
</html>
