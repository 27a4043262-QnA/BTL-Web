
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục môn học - EduTrack</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">

    <!-- CSS chung EduTrack -->
    <link rel="stylesheet" href="../assets/css/main.css">

    <!-- CSS riêng trang Danh mục -->
    <link rel="stylesheet" href="../assets/css/courses.css">

    <!-- Chatbot -->
    <link rel="stylesheet" href="../assets/css/chatbot.css">
</head>

<body>

    <!-- NỘI DUNG CHÍNH -->
    <main id="main-content">

        <!-- KHỐI 1: TIÊU ĐỀ -->
        <section class="page-intro">
            <h1>Danh mục môn học</h1>
            <p>
                Tra cứu, theo dõi tài liệu và ôn thi sát sườn
                cho mọi môn học tại giảng đường đại học.
            </p>
        </section>

        <!-- KHỐI 2: BỘ LỌC VÀ TÌM KIẾM -->
        <section class="filter-bar"
                 aria-label="Tìm kiếm và bộ lọc môn học">

            <!-- HÀNG 1 - BÊN TRÁI: LỌC NHÓM MÔN -->
            <div id="course-filters"
                 class="filter-buttons"
                 role="group"
                 aria-label="Lọc theo nhóm môn học">

                <button type="button"
                        class="filter-btn"
                        data-filter="all"
                        aria-pressed="true">
                    Tất cả
                </button>

                <button type="button"
                        class="filter-btn"
                        data-filter="dai-cuong"
                        aria-pressed="false">
                    Đại cương
                </button>

                <button type="button"
                        class="filter-btn"
                        data-filter="co-so-nganh"
                        aria-pressed="false">
                    Cơ sở ngành
                </button>

                <button type="button"
                        class="filter-btn"
                        data-filter="chuyen-nganh"
                        aria-pressed="false">
                    Chuyên ngành
                </button>

            </div>

            <!-- HÀNG 1 - BÊN PHẢI: TÌM KIẾM -->
            <form class="search-form"
                  role="search"
                  action="#"
                  method="GET">

                <label for="course-search" class="sr-only">
                    Tìm kiếm môn học
                </label>

                <input
                    type="search"
                    id="course-search"
                    name="q"
                    class="form-control"
                    placeholder="Tìm tên môn học"
                    autocomplete="off">
            </form>

            <!-- HÀNG 2 - BÊN PHẢI: LỌC TÍN CHỈ VÀ SẮP XẾP -->
            <div class="course-extra-filters"
                 role="group"
                 aria-label="Lọc theo số tín chỉ và sắp xếp">

                <!-- Lọc số tín chỉ -->
                <div class="course-select-group">
                    <label for="course-credits-filter"
                           class="sr-only">
                        Số tín chỉ
                    </label>

                    <select id="course-credits-filter"
                            class="form-control">
                        <option value="all">Tất cả tín chỉ</option>
                        <option value="2">2 tín chỉ</option>
                        <option value="3">3 tín chỉ</option>
                        <option value="4">4 tín chỉ</option>
                    </select>
                </div>

                
            <!-- Nút sắp xếp: Nhấn để chuyển A-Z / Z-A -->
            <div class="course-select-group">

                <button type="button"
                        id="course-sort"
                        class="course-sort-toggle"
                        aria-label="Đang sắp xếp A đến Z. Nhấn để chuyển sang Z đến A"
                        title="Chuyển sang Z–A">

                    <span class="course-sort-icon" aria-hidden="true">
                        ↓
                    </span>

                    <span class="course-sort-text">
                        A–Z
                    </span>

                </button>

            </div>


            </div>

        </section>

        <!-- KHỐI 3: TRẠNG THÁI TẢI JSON -->
        <div id="course-load-status"
             class="course-load-status"
             role="status"
             aria-live="polite"
             hidden>
        </div>

        <!-- THÔNG BÁO SỐ LƯỢNG KẾT QUẢ -->
        <p class="course-result-count"
           aria-live="polite"></p>

        <!-- KHỐI 4: DANH SÁCH MÔN HỌC -->
        <!-- Các Card được JavaScript tạo từ JSON -->
        <section id="course-list"
                 class="row"
                 aria-label="Danh sách môn học">
        </section>

        <!-- KHỐI 5: PHÂN TRANG -->
        <nav class="et-course-pagination"
             aria-label="Điều hướng trang danh mục"
             hidden>

            <ul class="pagination justify-content-center">
            </ul>

        </nav>

    </main>

    <!-- JAVASCRIPT -->
    <script src="../assets/js/courses.js" defer></script>
    <script src="../assets/js/chatbot.js" defer></script>
    <script src="../assets/js/main.js" defer></script>

</body>
</html>
